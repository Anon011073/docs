<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factual Docs Clone</title>
    <!-- Halfmoon CSS -->
    <link href="https://cdn.jsdelivr.net/npm/halfmoon@1.1.1/css/halfmoon-variables.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css">
</head>
<body class="with-custom-webkit-scrollbars with-custom-css-scrollbars" data-dm-shortcut-enabled="true" data-sidebar-shortcut-enabled="true" data-set-preferred-mode-onload="true">
    <div class="page-wrapper with-navbar">
        <nav class="navbar">
            <div class="navbar-content">
                <a href="/" class="navbar-brand">Factual Docs Clone</a>
                <div class="dropdown with-arrow" data-dm-toggle="dropdown" id="categories-dropdown">
                    <button class="btn" data-toggle="dropdown" type="button" id="categories-button">
                        Categories <i class="fa fa-angle-down" aria-hidden="true"></i>
                    </button>
                    <div class="dropdown-menu" aria-labelledby="categories-button">
                        <!-- Categories will be populated here -->
                    </div>
                </div>
            </div>
            <div class="w-full d-flex justify-content-between">
                <form class="form-inline w-half" id="search-form">
                    <input type="text" class="form-control" placeholder="Search for videos...">
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
                <div class="navbar-content" id="user-actions">
                    <!-- User actions will be dynamically populated -->
                </div>
            </div>
        </nav>

        <div class="content-wrapper">
            <div class="container-fluid">
                <div class="row" id="video-grid">
                    <!-- Video thumbnails will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/halfmoon@1.1.1/js/halfmoon.min.js"></script>
    <script src="/auth.js"></script>
    <script src="/video.js"></script>
    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userActions = document.getElementById('user-actions');
            const loggedInUser = getLoggedInUser();

            if (loggedInUser) {
                const user = users.find(u => u.username === loggedInUser);
                let adminLink = '';
                if (user && user.isAdmin) {
                    adminLink = '<a href="/add-video.html" class="btn">Add Video</a>';
                }
                userActions.innerHTML = `
                    ${adminLink}
                    <a href="/profile.html" class="btn">${loggedInUser}</a>
                    <button class="btn btn-danger" id="logout">Logout</button>
                `;
                document.getElementById('logout').addEventListener('click', (e) => {
                    e.preventDefault();
                    logout();
                    window.location.reload();
                });
            } else {
                userActions.innerHTML = `
                    <a href="/login.html" class="btn">Login</a>
                    <a href="/register.html" class="btn btn-primary">Register</a>
                `;
            }

            renderVideos();

            document.getElementById('search-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const searchTerm = e.target.querySelector('input').value;
                const filteredVideos = videos.filter(video => video.title.toLowerCase().includes(searchTerm.toLowerCase()));
                renderVideos(filteredVideos);
            });
        });
    </script>
</body>
</html>
