<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Video - Factual Docs Clone</title>
    <!-- Halfmoon CSS -->
    <link href="https://cdn.jsdelivr.net/npm/halfmoon@1.1.1/css/halfmoon-variables.min.css" rel="stylesheet" />
</head>
<body class="with-custom-webkit-scrollbars with-custom-css-scrollbars" data-dm-shortcut-enabled="true" data-sidebar-shortcut-enabled="true" data-set-preferred-mode-onload="true">
    <div class="page-wrapper with-navbar">
        <nav class="navbar">
            <div class="navbar-content">
                <a href="/" class="navbar-brand">Factual Docs Clone</a>
            </div>
            <div class="navbar-content ml-auto" id="user-actions">
                <!-- User actions will be dynamically populated -->
            </div>
        </nav>

        <div class="content-wrapper">
            <div class="container">
                <div class="card shadow-sm mx-auto" style="max-width: 600px;">
                    <div class="card-body">
                        <h2 class="card-title">Add a new video</h2>
                        <form id="add-video-form">
                            <div class="form-group">
                                <label for="video-url">YouTube Video URL</label>
                                <input type="text" id="video-url" name="video-url" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="video-description">Description</label>
                                <textarea id="video-description" name="video-description" class="form-control" required></textarea>
                            </div>
                            <div class="form-group">
                                <label for="video-category">Category</label>
                                <select id="video-category" name="video-category" class="form-control" required>
                                    <!-- Categories will be populated here -->
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="video-tags">Tags (comma-separated)</label>
                                <input type="text" id="video-tags" name="video-tags" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Add Video</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/halfmoon@1.1.1/js/halfmoon.min.js"></script>
    <script src="/auth.js"></script>
    <script src="/video.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loggedInUser = getLoggedInUser();
            if (!loggedInUser) {
                window.location.href = '/login.html';
                return;
            }
            const user = users.find(u => u.username === loggedInUser);
            if (!user || !user.isAdmin) {
                window.location.href = '/';
                return;
            }

            const userActions = document.getElementById('user-actions');
            userActions.innerHTML = `
                <a href="/profile.html" class="btn">${loggedInUser}</a>
                <button class="btn btn-danger" id="logout">Logout</button>
            `;
            document.getElementById('logout').addEventListener('click', (e) => {
                e.preventDefault();
                logout();
                window.location.href = '/';
            });

            const categorySelect = document.getElementById('video-category');
            const categories = ['Science', 'History', 'Technology', 'Conspiracy', 'Mystery'];
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });

            async function fetchVideoTitle(videoId) {
                try {
                    const response = await fetch(`http://localhost:3000/get-video-title?videoId=${videoId}`);
                    const data = await response.json();
                    return data.title;
                } catch (error) {
                    console.error('Failed to fetch video title:', error);
                    return null;
                }
            }

            document.getElementById('add-video-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const videoUrl = e.target['video-url'].value;
                const videoDescription = e.target['video-description'].value;
                const videoCategory = e.target['video-category'].value;
                const videoTags = e.target['video-tags'].value.split(',').map(tag => tag.trim());

                const videoId = extractVideoId(videoUrl);
                if (!videoId) {
                    alert('Invalid YouTube URL');
                    return;
                }

                const videoTitle = await fetchVideoTitle(videoId);
                if (!videoTitle) {
                    alert('Failed to fetch video title. Please check the URL and try again.');
                    return;
                }

                const result = addVideo(videoTitle, videoUrl, videoDescription, videoCategory, videoTags);
                if (result.success) {
                    alert('Video added successfully!');
                    e.target.reset();
                } else {
                    alert(result.message);
                }
            });
        });
    </script>
</body>
</html>
